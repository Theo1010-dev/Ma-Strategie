<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma stratégie</title>
<meta name="description" content="Ton plan PEA, mois après mois.">
<meta name="theme-color" content="#14302A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEEB; --surface:#F6F9F7; --surface-2:#DCE5E1; --ink:#14302A; --ink-2:#4A625C; --ink-3:#71857F; --line:#C5D3CE;
  --good:#1E6E5A; --warn:#A8432C; --focus:#2D50A6; --on-ink:#F6F9F7; --amber:#A9680B;
  --c0:#1E6E5A; --c1:#2D50A6; --c2:#A9680B; --c3:#7646AE; --c4:#87978F; --c5:#B4533A; --c6:#0F7C8C; --c7:#6B7A1F; --c8:#A63D74;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1816; --surface:#17231F; --surface-2:#22302B; --ink:#E3EDE9; --ink-2:#A6B8B2; --ink-3:#7E918B; --line:#2E403A;
    --good:#41B595; --warn:#EF8E72; --focus:#8AA5F2; --on-ink:#0F1816; --amber:#E4A64C;
    --c0:#41B595; --c1:#8AA5F2; --c2:#E4A64C; --c3:#BD93EE; --c4:#8C9C96; --c5:#F08A6E; --c6:#4FC3D3; --c7:#B5C45A; --c8:#E58BBE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1816; --surface:#17231F; --surface-2:#22302B; --ink:#E3EDE9; --ink-2:#A6B8B2; --ink-3:#7E918B; --line:#2E403A;
  --good:#41B595; --warn:#EF8E72; --focus:#8AA5F2; --on-ink:#0F1816; --amber:#E4A64C;
  --c0:#41B595; --c1:#8AA5F2; --c2:#E4A64C; --c3:#BD93EE; --c4:#8C9C96; --c5:#F08A6E; --c6:#4FC3D3; --c7:#B5C45A; --c8:#E58BBE;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;}
button:disabled{opacity:.45;cursor:not-allowed;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.015em;margin:0;}
p{margin:0;}
.muted{color:var(--ink-2);}
.small{font-size:14px;}
[hidden]{display:none !important;}

/* En-tête */
.top{max-width:560px;margin:0 auto;padding:16px 20px 2px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.wordmark{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-0.03em;}
.top-actions{display:flex;gap:8px;}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;}
.icon-btn svg{width:22px;height:22px;}
.market{max-width:560px;margin:8px auto 0;padding:0 20px;display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink-2);}
.market .dot{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none;}
.market[data-state="open"] .dot{background:var(--good);}
.market[data-state="best"] .dot{background:var(--good);box-shadow:0 0 0 4px rgba(30,110,90,.22);}
.market[data-state="wait"] .dot{background:var(--amber);}
main{max-width:560px;margin:0 auto;padding:4px 20px calc(110px + env(safe-area-inset-bottom,0px));}

/* Accueil */
.hero{padding:18px 0 0;}
.hero h1{font-weight:750;font-size:clamp(27px,7.4vw,36px);line-height:1.08;max-width:18ch;}
.hero .lead{color:var(--ink-2);margin-top:8px;max-width:40ch;}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:clamp(8px,2.6vw,16px);margin-top:20px;align-items:end;}
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;}
.tube{position:relative;width:100%;max-width:66px;height:164px;border-radius:33px 33px 14px 14px;border:2px solid var(--line);background:var(--surface);overflow:hidden;display:flex;flex-direction:column-reverse;}
.tube .seg{width:100%;flex:none;}
.tube .ghost{width:100%;flex:none;height:0;background:repeating-linear-gradient(135deg,var(--c) 0 5px,transparent 5px 10px);opacity:.75;transition:height 1s cubic-bezier(.2,.75,.2,1) .15s;}
.notch{position:absolute;left:0;right:0;border-top:2.5px dashed var(--ink);opacity:.6;}
.gauge.is-next .tube{border-color:var(--c);box-shadow:0 0 0 4px var(--surface-2);box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent);}
.gauge.is-paused .tube{border-style:dashed;}
.g-val{font-family:var(--display);font-weight:750;font-size:21px;line-height:1.1;margin-top:9px;}
.g-name{font-weight:700;font-size:13.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-target{font-size:12px;color:var(--ink-2);line-height:1.3;}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--ink-2);}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.lg-notch{width:18px;border-top:2.5px dashed var(--ink);opacity:.6;}
.lg-ghost{width:14px;height:14px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--ink-2) 0 3px,transparent 3px 6px);}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);border-left:4px solid var(--amber);font-size:15px;}
.banner .btn{flex:none;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;margin-top:16px;}
.panel h2{font-size:21px;font-weight:700;line-height:1.2;}
.panel h3{font-size:17px;font-weight:700;margin-top:16px;}
.amount-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;color:var(--ink-2);font-size:15px;}
.amount-line b{color:var(--ink);font-family:var(--display);font-size:20px;}
.amount-edit{margin-top:10px;}
.amount{display:flex;align-items:baseline;gap:8px;}
.amount input{font-family:var(--display);font-weight:750;font-size:40px;line-height:1.1;width:5ch;border:none;border-bottom:2.5px solid var(--ink);background:transparent;padding:0 2px;border-radius:0;}
.amount span{font-family:var(--display);font-size:28px;font-weight:700;}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:14px;}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}

.order{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 14px 22px;margin-top:12px;}
.order::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;border-radius:0 5px 5px 0;background:var(--c);}
.order-main{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.order-title{font-family:var(--display);font-weight:750;font-size:21px;line-height:1.15;}
.order-sub{color:var(--ink-2);font-size:14.5px;margin-top:2px;}
.order dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;padding-top:12px;border-top:1.5px dashed var(--line);font-size:15px;}
.order dt{color:var(--ink-2);}
.order dd{margin:0;font-weight:700;}
.copy{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;white-space:nowrap;}
.why1{margin-top:12px;font-size:15px;}
.notice{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2);font-size:15px;}

details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;}
details summary::-webkit-details-marker{display:none;}
details summary::after{content:"+";font-family:var(--display);font-size:20px;line-height:1;color:var(--ink-2);}
details[open] > summary::after{content:"–";}
.why{list-style:none;padding:0;margin:6px 0 0;}
.why li{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:6px 0;font-size:15px;align-items:baseline;}
.why li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);transform:translateY(1px);}
.steps{counter-reset:step;list-style:none;padding:0;margin:6px 0 0;}
.steps li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;align-items:start;}
.steps li:first-child{border-top:none;}
.steps li::before{content:counter(step);font-family:var(--display);font-weight:750;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:14px;}

.btn{border:none;border-radius:999px;padding:14px 20px;font-weight:700;font-size:16px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn svg{width:20px;height:20px;flex:none;}
.btn-primary{background:var(--ink);color:var(--on-ink);}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-small{padding:8px 14px;font-size:14px;}
.btn-danger{background:transparent;border:1.5px solid var(--warn);color:var(--warn);}
.btn-block{width:100%;}
.stack{display:grid;gap:10px;margin-top:16px;}
.linkish{background:none;border:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:inherit;}
.panic{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:16px 18px;border-radius:var(--r-l);border:2px solid var(--ink);background:transparent;text-align:left;}
.panic b{font-family:var(--display);font-size:18px;display:block;}
.panic span{font-size:14px;color:var(--ink-2);}
.panic svg{width:26px;height:26px;flex:none;}

/* Portefeuille */
.seg-ctl{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;margin-top:14px;}
.seg-ctl button{border:none;background:transparent;border-radius:999px;padding:9px 10px;font-weight:700;font-size:15px;color:var(--ink-2);}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.total{font-family:var(--display);font-weight:750;font-size:40px;line-height:1.05;margin-top:8px;}
.total-sub{color:var(--ink-2);font-size:14.5px;margin-top:4px;}
.pos{color:var(--good);} .neg{color:var(--warn);}
.alloc{display:flex;height:14px;border-radius:8px;overflow:hidden;margin-top:14px;background:var(--surface-2);}
.alloc span{display:block;height:100%;}
.lcard{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:14px 0;}
.lcard:first-of-type{border-top:none;}
.swatch{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;display:inline-block;}
.lcard .nm{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lcard .sub{font-size:13.5px;color:var(--ink-2);}
.lcard .rt{text-align:right;line-height:1.25;}
.lcard .rt b{font-family:var(--display);font-size:18px;display:block;}
.lcard .rt small{font-size:12.5px;color:var(--ink-2);}
.tag{font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink-2);}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;}
.kv:first-child{border-top:none;}
.kv b{text-align:right;}
.progress{height:12px;border-radius:7px;background:var(--surface-2);margin-top:8px;overflow:hidden;}
.progress i{display:block;height:100%;background:var(--good);border-radius:7px;}

/* Analyse */
.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.region{background:var(--bg);border-radius:var(--r-m);padding:12px 14px;}
.region span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.3;}
.region b{display:block;font-family:var(--display);font-size:25px;line-height:1.15;margin-top:4px;}
.region small{color:var(--ink-2);font-size:12.5px;}
.xrow{margin-top:14px;}
.xtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;}
.xtop .xname{font-weight:700;}
.xtop b{font-family:var(--display);font-size:17px;}
.xtop small{color:var(--ink-2);font-size:12.5px;margin-left:6px;}
.xbar{position:relative;height:12px;border-radius:7px;background:var(--surface-2);margin-top:6px;display:flex;}
.xbar span{display:block;height:100%;}
.xbar span:first-child{border-radius:7px 0 0 7px;}
.xbar span:last-of-type{border-radius:0 7px 7px 0;}
.xbar span:only-of-type{border-radius:7px;}
.xbar .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2.5px solid var(--ink);opacity:.75;}
.xex{font-size:13px;color:var(--ink-2);margin-top:4px;}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--ink-2);}
.keys span{display:inline-flex;align-items:center;gap:6px;}
.keys .k{width:12px;height:12px;border-radius:3px;background:var(--c);}
.keys .kt{width:0;height:14px;border-left:2.5px solid var(--ink);opacity:.75;}
.insights{list-style:none;padding:0;margin:8px 0 0;}
.insights li{padding:10px 0 10px 16px;border-top:1px solid var(--line);position:relative;font-size:15.5px;}
.insights li:first-child{border-top:none;}
.insights li::before{content:"";position:absolute;left:0;top:18px;width:7px;height:7px;border-radius:50%;background:var(--ink);}
.verdict{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2);font-weight:700;}

/* Calendrier */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cal-head h2{font-size:22px;}
.cal-nav{display:flex;gap:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;}
.cal-dow{text-align:center;font-size:12px;color:var(--ink-2);font-weight:700;padding-bottom:4px;}
.cal-day{position:relative;aspect-ratio:1/1;border:none;border-radius:12px;background:var(--bg);font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--ink);}
.cal-day.out{background:transparent;color:var(--ink-3);font-weight:400;}
.cal-day.today{outline:2px solid var(--ink);}
.cal-day.sel{background:var(--ink);color:var(--on-ink);}
.cal-day .mk{display:flex;gap:3px;height:7px;}
.cal-day .mk i{width:7px;height:7px;border-radius:50%;}
.mk-plan{background:var(--good);}
.mk-done{background:var(--good);box-shadow:inset 0 0 0 2px var(--surface);border:1.5px solid var(--good);}
.mk-closed{background:var(--warn);}
.mk-step{background:var(--amber);}
.cal-day.sel .mk-done{box-shadow:none;}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--ink-2);}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.day-detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.day-detail li{font-size:15px;padding:3px 0;}
.dates{list-style:none;padding:0;margin:8px 0 0;}
.dates li{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;}
.dates li:first-child{border-top:none;}
.dates time{font-weight:700;}
.streak{display:flex;align-items:baseline;gap:10px;}
.streak b{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;}
.streak span{font-size:16px;font-weight:700;}
.entry{border-top:1px solid var(--line);padding:12px 0;}
.entry:first-child{border-top:none;}
.entry-head{display:flex;justify-content:space-between;color:var(--ink-2);font-size:13.5px;}
.entry h3{font-size:16.5px;margin-top:2px;}
.entry ul{list-style:none;padding:0;margin:4px 0 0;}
.entry li{display:flex;align-items:center;gap:8px;font-size:15px;padding:1px 0;}
.entry .note{margin-top:4px;font-size:14.5px;color:var(--ink-2);font-style:italic;}

/* Guide */
.rules{list-style:none;padding:0;margin:8px 0 0;}
.rules li{padding:10px 0 10px 30px;border-top:1px solid var(--line);position:relative;font-size:15.5px;}
.rules li:first-child{border-top:none;}
.rules li::before{content:"";position:absolute;left:4px;top:15px;width:12px;height:7px;border-left:2.5px solid var(--good);border-bottom:2.5px solid var(--good);transform:rotate(-45deg);}
.role{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
.role:first-child{border-top:none;}
.role .swatch{margin-top:5px;}
.role p{font-size:15px;color:var(--ink-2);}
.role strong{display:block;color:var(--ink);}
.range-row{margin-top:14px;}
.range-row label{display:flex;justify-content:space-between;font-size:15px;}
.range-row label b{font-family:var(--display);font-size:18px;}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--good);}
.proj-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.proj-out div{background:var(--bg);border-radius:var(--r-s);padding:10px 6px;text-align:center;}
.proj-out div.main{outline:2px solid var(--good);}
.proj-out b{display:block;font-family:var(--display);font-size:18px;line-height:1.15;}
.proj-out span{font-size:12.5px;color:var(--ink-2);}
.chart{width:100%;height:auto;margin-top:12px;display:block;}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px;cursor:pointer;}
.check:first-of-type{border-top:none;}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--good);flex:none;}
.disclaimer{margin-top:20px;font-size:13px;color:var(--ink-2);}

/* Champs */
.field{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2);}
.field input,.field textarea,.field select{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 11px;color:var(--ink);font-size:16px;width:100%;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink);outline:none;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.err{color:var(--warn);font-weight:700;font-size:14.5px;margin-top:10px;}
.ok{color:var(--good);font-weight:700;}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.tab{background:none;border:none;color:var(--ink-2);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;min-width:0;white-space:nowrap;}
.tab svg{width:24px;height:24px;}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;}
.tab[aria-current="page"] svg{stroke-width:2.4;}

/* Fenêtres */
dialog{border:none;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:var(--r-l) var(--r-l) 0 0;background:var(--surface);color:var(--ink);max-height:92vh;}
dialog::backdrop{background:rgba(8,18,15,.5);}
.dlg{padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;}
.dlg h2{font-size:23px;font-weight:750;line-height:1.15;}
.dlg h3{font-size:17px;margin-top:16px;}
.dlg p{margin-top:8px;}
.dlg-actions{display:flex;gap:10px;margin-top:20px;}
.dlg-actions .btn{flex:1;}
.buy-row{display:grid;grid-template-columns:1fr 80px 96px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line);}
.buy-row:first-of-type{border-top:none;}
.buy-row .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-bottom:10px;min-width:0;}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;border:none;padding:0;}
.moods legend{font-weight:700;margin-bottom:8px;padding:0;}
.moods label{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:8px 4px;font-size:12px;text-align:center;cursor:pointer;background:var(--bg);}
.moods label span{font-size:24px;line-height:1.2;}
.moods input{position:absolute;opacity:0;pointer-events:none;}
.moods label:has(input:checked){border-color:var(--ink);background:var(--surface-2);}
.pick{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin-top:8px;}
.pick b{display:block;font-size:15.5px;}
.pick small{color:var(--ink-2);font-size:13px;}
.diff{border-top:1px solid var(--line);padding:10px 0;font-size:15px;}
.diff:first-child{border-top:none;}
.diff b{display:block;}
.spinner{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--surface-2);border-top-color:var(--ink);animation:spin 1s linear infinite;margin:18px auto 8px;}
@keyframes spin{to{transform:rotate(360deg);}}

.ob{padding-top:10px;}
.ob-dots{display:flex;gap:6px;margin:6px 0 14px;}
.ob-dots i{width:22px;height:5px;border-radius:3px;background:var(--surface-2);}
.ob-dots i.on{background:var(--ink);}
.ob h1{font-weight:750;font-size:clamp(28px,7.6vw,38px);line-height:1.08;}
.ob .lead{color:var(--ink-2);margin-top:8px;}
.ob-big{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-0.03em;margin-top:18px;}
.ob-list{list-style:none;padding:0;margin:18px 0 0;}
.ob-list li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:10px 0;font-size:16px;}
.ob-list li b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-family:var(--display);}
.ob-privacy{margin-top:16px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);font-size:14.5px;display:flex;gap:10px;align-items:flex-start;}
.ob-privacy svg{width:22px;height:22px;flex:none;margin-top:1px;}
.tpl{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-top:10px;}
.tpl[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface-2);}
.tpl b{display:block;font-family:var(--display);font-size:19px;}
.tpl small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px;}
.tpl .alloc{height:10px;margin-top:10px;}
.tpl .tpl-keys{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--ink-2);}
.tpl .tpl-keys span{display:inline-flex;align-items:center;gap:5px;}
.tpl .tpl-keys i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;}
.ob-actions{display:grid;gap:10px;margin-top:22px;}
.ob-field{margin-top:16px;}
.ob-field > span{display:block;font-weight:700;margin-bottom:6px;}
.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-top:10px;}
.choice b{display:block;font-size:16.5px;}
.choice small{display:block;color:var(--ink-2);font-size:14px;}
.choice svg{width:22px;height:22px;color:var(--ink-2);}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 40px);text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion: reduce){ .tube .ghost,#toast{transition:none;} .spinner{animation-duration:3s;} }
@media (min-width:600px){ .tube{height:186px;} }
</style>

}
const utcDate = (y, m, d) => new Date(Date.UTC(y, m - 1, d));

const diffDays = (a, b) => Math.round((b - a) / 86400000);

function isoToDate(iso){ const [y, m, d] = String(iso).split('-').map(Number); return (y && m && d) ? utcDate(y, m, d) : null; }
function isoToFr(iso, opts = { day:'numeric', month:'short', year:'numeric' }){ const dt = isoToDate(iso); return dt ? dateFr(dt, opts) : String(iso); }
function easter(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
        month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return utcDate(y, month, day);
}
const closedCache = {};
function closedDays(y){
  if (closedCache[y]) return closedCache[y];
  const e = easter(y);
  const gf = new Date(e); gf.setUTCDate(e.getUTCDate() - 2);
  const em = new Date(e); em.setUTCDate(e.getUTCDate() + 1);
  closedCache[y] = [
    { iso:`${y}-01-01`, label:"Jour de l'an" }, { iso:isoOf(gf), label:'Vendredi saint' },
    { iso:isoOf(em), label:'Lundi de Pâques' }, { iso:`${y}-05-01`, label:'1er mai' },
    { iso:`${y}-12-25`, label:'Noël' }, { iso:`${y}-12-26`, label:'Lendemain de Noël' }
  ];
  return closedCache[y];
}
function closedLabel(dt){ const iso = isoOf(dt); const c = closedDays(dt.getUTCFullYear()).find(x => x.iso === iso); return c ? c.label : null; }
function isTradingDay(dt){ const wd = dt.getUTCDay(); return wd !== 0 && wd !== 6 && !closedLabel(dt); }
function closeMinutes(dt){ const y = dt.getUTCFullYear(), iso = isoOf(dt); return (iso === `${y}-12-24` || iso === `${y}-12-31`) ? 14 * 60 + 5 : 17 * 60 + 30; }
function nextTradingDay(dt){ const d = new Date(dt); do { d.setUTCDate(d.getUTCDate() + 1); } while (!isTradingDay(d)); return d; }
function adjustedDate(y, m, day){ const dt = utcDate(y, m, day); while (!isTradingDay(dt)) dt.setUTCDate(dt.getUTCDate() + 1); return dt; }
function whenLabel(dt){ return diffDays(todayUTC(), dt) === 1 ? 'demain' : dateFr(dt, { weekday:'long', day:'numeric', month:'long' }); }
function marketStatus(){
  const p = parisNow(), today = utcDate(p.y, p.m, p.d), mins = p.hour * 60 + p.minute;
  if (!isTradingDay(today)) return { state:'closed', text:`Bourse fermée aujourd'hui. Réouverture ${whenLabel(nextTradingDay(today))} à 9h.` };
  const close = closeMinutes(today);
  if (mins < 9 * 60) return { state:'closed', text:'Bourse fermée. Ouverture à 9h.' };
  if (mins >= close) return { state:'closed', text:`Bourse fermée. Réouverture ${whenLabel(nextTradingDay(today))} à 9h.` };
  if (close < 17 * 60 + 30) return { state:'wait', text:"Bourse ouverte, mais elle ferme à 14h05 aujourd'hui." };
  if (mins < 9 * 60 + 30) return { state:'wait', text:"Bourse ouverte. Attends un peu : à l'ouverture, les prix sont moins serrés." };
  if (mins < 15 * 60 + 30) return { state:'open', text:'Bourse ouverte. Le meilleur moment commence à 15h30.' };
  if (mins < 17 * 60) return { state:'best', text:"Bourse ouverte : c'est le meilleur moment pour acheter." };
  return { state:'wait', text:"Bourse ouverte jusqu'à 17h30. Passe ton ordre avant 17h20." };
}

function parseCSV(txt){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',' || ch === ';' || ch === '\t') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function normSheetUrl(u){
  u = String(u || '').trim();
  if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)) return null;
  if (/\/pubhtml/.test(u)) u = u.replace('/pubhtml', '/pub');
  if (!/output=csv/.test(u)) u += (u.includes('?') ? '&' : '?') + 'output=csv';
  return u;
}

    state.settings.priceFetchedAt = Date.now();

   5. Calculs
   ===================================================================== */
const lines = () => state.lines;
const lineById = id => state.lines.find(l => l.id === id);
const lineValue = l => (+l.parts || 0) * (+l.price || 0);
const investedTotal = () => state.lines.reduce((a, l) => a + lineValue(l), 0);
const buyLines = () => state.lines.filter(l => l.status === 'buy');
const targetSum = () => buyLines().reduce((a, l) => a + (+l.target || 0), 0);
function pockets(){
  const P = buyLines().map(l => ({ id:l.id, line:l, members:[l], target:+l.target || 0, max:l.max }));
  state.lines.filter(l => l.status === 'pause' && l.countsIn).forEach(l => { const p = P.find(x => x.id === l.countsIn); if (p) p.members.push(l); });
  const sum = P.reduce((a, p) => a + p.target, 0);
  P.forEach(p => { p.tf = sum > 0 ? p.target / sum : (P.length ? 1 / P.length : 0); p.value = p.members.reduce((a, m) => a + lineValue(m), 0); });
  return P;
}
const limitPrice = (price, stale) => Math.ceil(price * (stale ? 1.012 : 1.003) * 100) / 100;
function pricesAgeDays(){ const dt = isoToDate(state.pricesUpdatedAt); return dt ? diffDays(dt, todayUTC()) : 999; }

function computePlan(contribution){
  const MIN = +state.settings.minOrder || 100;
  const P = pockets();
  const invested = investedTotal();
  const budget = round2((+state.cash || 0) + (+contribution || 0));
  const totalAfter = invested + budget;
  const stale = pricesAgeDays() > 1;
  P.forEach(p => { p.gap = p.tf * totalAfter - p.value; p.cur = invested > 0 ? p.value / invested * 100 : 0; });
  const plan = { budget, invested, P, orders:[], leftover:budget, newVals:{}, newInv:invested, reason:null, minOrder:MIN, stale };
  P.forEach(p => { plan.newVals[p.id] = p.value; });
  if (!P.length) { plan.reason = 'nolines'; return plan; }
  const noPrice = P.filter(p => p.gap > 0 && !(+p.line.price > 0));
  if (noPrice.length) { plan.reason = 'noprice'; plan.missing = noPrice.map(p => p.line.short); return plan; }
  const cands = P.filter(p => p.gap > 0 && (+p.line.price || 0) > 0 && !(p.max && invested > 0 && p.value / invested * 100 >= p.max)).sort((a, b) => b.gap - a.gap).slice(0, 8);
  if (budget < MIN) { plan.reason = 'small'; return plan; }
  if (!cands.length) { plan.reason = 'none'; return plan; }
  let best = null;
  const n = cands.length;
  for (let mask = 1; mask < (1 << n); mask++) {
    const items = [];
    for (let i = 0; i < n; i++) if (mask & (1 << i)) {
      const p = cands[i], price = +p.line.price, lim = limitPrice(price, stale);
      items.push({ p, price, lim, qty:Math.max(1, Math.ceil(MIN / lim)) });
    }
    let cost = items.reduce((a, it) => a + it.qty * it.lim, 0);
    if (cost > budget + 1e-9) continue;
    for (;;) {
      const rem = budget - cost;
      let pick = null, need = -Infinity;
      items.forEach(it => { if (it.lim > rem + 1e-9) return; const nd = it.p.gap - it.qty * it.price; if (nd > need) { need = nd; pick = it; } });
      if (!pick) break;
      pick.qty += 1; cost += pick.lim;
    }
    const newVals = {}; P.forEach(p => { newVals[p.id] = p.value; });
    let added = 0;
    items.forEach(it => { newVals[it.p.id] += it.qty * it.price; added += it.qty * it.price; });
    const newInv = invested + added;
    if (items.some(it => it.p.max && newInv > 0 && newVals[it.p.id] / newInv * 100 > it.p.max + 0.5)) continue;
    let dev = 0;
    P.forEach(p => { const w = newInv > 0 ? newVals[p.id] / newInv : 0; dev += Math.pow(w - p.tf, 2); });
    const leftover = budget - cost;
    const score = dev + 1e-6 * items.length + 1e-4 * (leftover / Math.max(totalAfter, 1));
    if (!best || score < best.score) best = { items, cost, leftover, score, newVals, newInv };
  }
  if (!best) { plan.reason = 'nofit'; return plan; }
  plan.orders = best.items.map(it => ({ line:it.p.line.id, qty:it.qty, limit:it.lim, price:it.price, amount:round2(it.qty * it.lim) })).sort((a, b) => b.amount - a.amount);
  plan.leftover = round2(best.leftover);
  plan.newVals = best.newVals; plan.newInv = best.newInv;
  return plan;
}

function monthDone(ym){ return state.journal.some(e => e.month === ym && (e.type === 'buy' || e.type === 'setup')); }
function streak(){
  const months = new Set(state.journal.filter(e => e.type === 'buy' || e.type === 'setup').map(e => e.month));
  const p = parisNow();
  let y = p.y, m = p.m;
  if (!months.has(ymOf(y, m))) { m -= 1; if (m === 0) { m = 12; y -= 1; } }
  let n = 0;
  while (months.has(ymOf(y, m))) { n += 1; m -= 1; if (m === 0) { m = 12; y -= 1; } }
  return n;
}
function rdvInfo(){
  const p = parisNow(), today = utcDate(p.y, p.m, p.d), day = state.settings.investDay;
  if (monthDone(p.ym)) {
    let y = p.y, m = p.m + 1; if (m > 12) { m = 1; y += 1; }
    const dt = adjustedDate(y, m, day);
    return { kind:'done', date:dt, days:diffDays(today, dt) };
  }
  const dt = adjustedDate(p.y, p.m, day), dd = diffDays(today, dt);
  return { kind: dd > 0 ? 'soon' : dd === 0 ? 'today' : 'late', date:dt, days:dd };
}
function fv(p0, monthly, rate, years){
  const rm = Math.pow(1 + rate, 1 / 12) - 1, n = Math.round(years * 12), g = Math.pow(1 + rm, n);
  return p0 * g + (rm === 0 ? monthly * n : monthly * (g - 1) / rm);
}

/* Composition d'une ligne : catalogue, action unique ou estimation */
function compOf(l){
  if (l.kind === 'stock') {
    if (!l.country && !l.sector) return null;
    const c = {}, s = {};
    if (l.country) c[l.country] = 100;
    if (l.sector) s[l.sector] = 100;
    return { c, s, nvda:/nvidia/i.test(l.name) ? 100 : 0 };
  }
  if (l.kind === 'custom') return l.comp;
  const k = KINDS[l.kind];
  return k && k.c ? { c:k.c, s:k.s, nvda:k.nvda || 0 } : null;
}
function lineWeights(extra){
  const vals = {}; let tot = 0;
  state.lines.forEach(l => { vals[l.id] = lineValue(l) + ((extra && extra[l.id]) || 0); tot += vals[l.id]; });
  const w = {}; state.lines.forEach(l => { w[l.id] = tot > 0 ? vals[l.id] / tot : 0; });
  return w;
}
function breakdown(dim, keys, w){
  const out = {}; keys.forEach(k => { out[k] = { total:0, parts:{} }; });
  let known = 0;
  state.lines.forEach(l => {
    const comp = compOf(l); if (!comp) return;
    const t = comp[dim] || {};
    const sum = Object.values(t).reduce((a, b) => a + b, 0) || 100;
    known += w[l.id] || 0;
    keys.forEach(k => { const v = (w[l.id] || 0) * ((t[k] || 0) / sum * 100); if (v > 0) { out[k].parts[l.id] = v; out[k].total += v; } });
  });
  return { out, known };
}
function marketRef(dim, keys){
  const a = KINDS.world[dim], b = KINDS.em[dim], o = {};
  keys.forEach(k => { o[k] = ACWI_DM * (a[k] || 0) + ACWI_EM * (b[k] || 0); });
  return o;
}
function planExtra(){
  const plan = lastPlan || computePlan(amountThisMonth);
  const extra = {}; plan.orders.forEach(o => { extra[o.line] = (extra[o.line] || 0) + o.qty * o.price; });
  return { extra, plan };
}
function guessKind(text){
  const t = String(text || '').toUpperCase();
  const cat = CATALOG.find(c => t.includes(c.isin) || new RegExp('\\b' + c.ticker + '\\b').test(t));
  if (cat) return cat.kind;
  if (/NASDAQ/.test(t)) return 'nasdaq';
  if (/S&P ?500|SP ?500/.test(t)) return 'sp500';
  if (/ACWI|PEA GLOBAL|ALL COUNTRY/.test(t)) return 'acwi';
  if (/EMERG|ÉMERG|EMERGENT/.test(t)) return 'em';
  if (/STOXX ?600|EUROPE 600/.test(t)) return 'stoxx600';
  if (/EURO ?STOXX ?50/.test(t)) return 'eurostoxx50';
  if (/CAC ?40/.test(t)) return 'cac40';
  if (/TOPIX|JAPON|JAPAN/.test(t)) return 'japan';
  if (/WORLD|MONDE/.test(t)) return 'world';
  if (/EUROPE/.test(t)) return 'europe';
  return 'custom';
}

function whyItems(plan){
  const inv = plan.invested, out = [];
  const bought = new Set(plan.orders.map(o => o.line));
  const behind = plan.P.slice().sort((a, b) => (b.tf * 100 - b.cur) - (a.tf * 100 - a.cur))[0];
  displayOrder().forEach(l => {
    const c = colorOf(l);
    if (l.status === 'pause') {
      const parent = l.countsIn ? lineById(l.countsIn) : null;
      out.push({ c, buy:false, t:`${l.short} est en pause : on n'en rachète pas${parent ? `, il compte dans la cible de ${parent.short}` : ''}.` });
      return;

    const name = p.members.length > 1 ? `${l.short} (avec ${listFr(p.members.filter(m => m.id !== l.id).map(m => m.short))})` : l.short;
    if (bought.has(l.id)) out.push({ c, buy:true, t:`${name} est à ${pct(p.cur)} pour une cible de ${pct(tgt)} : ${behind && p.id === behind.id ? "c'est la ligne la plus en retard" : 'elle est en retard'}.` });
    else if (p.max && p.cur >= p.max) out.push({ c, buy:false, t:`${name} est à ${pct(p.cur)}, au-dessus de ta limite de ${pct(p.max)} : on n'en rajoute pas.` });
    else if (p.cur > tgt + 0.5) out.push({ c, buy:false, t:`${name} est à ${pct(p.cur)}, au-dessus de sa cible (${pct(tgt)}) : on n'en rachète pas.` });

  });
  return out;
}

function monthsToGoal(p0, monthly, target, rate = 0.06){
  if (p0 >= target) return 0;
  const rm = Math.pow(1 + rate, 1 / 12) - 1;
  let v = p0;
  for (let k = 1; k <= 600; k++) { v = v * (1 + rm) + monthly; if (v >= target) return k; }
  return null;
}
function goalInfo(){
  const g = state.goal; if (!g) return null;
  const now = investedTotal() + (+state.cash || 0), monthly = +state.settings.monthly || 0;
  const pctDone = clamp(now / g.amount * 100, 0, 100);
  const k = monthsToGoal(now, monthly, g.amount);
  const p = parisNow();
  const eta = k == null ? null : utcDate(p.y + Math.floor((p.m - 1 + k) / 12), ((p.m - 1 + k) % 12) + 1, 1);
  let advice = '';
  if (g.date) {
    const tgt = isoToDate(g.date);
    const months = Math.max(0, (tgt.getUTCFullYear() - p.y) * 12 + (tgt.getUTCMonth() + 1 - p.m));
    if (months > 0) {
      const rm = Math.pow(1.06, 1 / 12) - 1, gr = Math.pow(1 + rm, months);
      const need = Math.max(0, (g.amount - now * gr) * rm / (gr - 1));
      advice = eta && eta <= tgt ? `Tu es dans les temps pour ${dateFr(tgt, { month:'long', year:'numeric' })}.` : `Pour y arriver en ${dateFr(tgt, { month:'long', year:'numeric' })}, il faudrait environ ${eur0(Math.ceil(need / 10) * 10)} par mois.`;
    }
  }
  return { g, now, pctDone, eta, advice };
}
function historyChart(){
  const h = (state.history || []).slice(-400);
  if (h.length < 2) return '<p class="small muted" style="margin-top:10px">Ta courbe apparaîtra au fil de tes mises à jour.</p>';
  const W = 320, H = 130, pl = 4, pr = 4, pt = 8, pb = 20;
  const t0 = isoToDate(h[0].d).getTime(), t1 = Math.max(isoToDate(h[h.length - 1].d).getTime(), t0 + 86400000);
  const maxV = Math.max(...h.map(x => Math.max(x.v, x.i))) * 1.05 || 1, minV = Math.min(...h.map(x => Math.min(x.v, x.i))) * 0.95;
  const x = d => pl + (W - pl - pr) * ((isoToDate(d).getTime() - t0) / (t1 - t0));
  const y = v => pt + (H - pt - pb) * (1 - (v - minV) / (maxV - minV || 1));
  const pts = k => h.map(e => `${x(e.d).toFixed(1)},${y(e[k]).toFixed(1)}`).join(' ');
  const first = dateFr(isoToDate(h[0].d), { month:'short', year:'2-digit' }), last = dateFr(isoToDate(h[h.length - 1].d), { month:'short', year:'2-digit' });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la valeur de ton PEA et de tes versements">

    <text x="${pl}" y="${H - 5}" font-size="10" fill="var(--ink-2)">${esc(first)}</text>
    <text x="${W - pr}" y="${H - 5}" font-size="10" fill="var(--ink-2)" text-anchor="end">${esc(last)}</text>

}

function cmpWord(you, mk){
  const d = you - mk;
  if (Math.abs(d) < 2) return 'Comme le marché.';
  if (d >= 6) return 'Nettement plus que le marché.';
  if (d >= 2) return 'Un peu plus que le marché.';
  if (d <= -6) return 'Nettement moins que le marché.';
  return 'Un peu moins que le marché.';
}
function stackBar(entry, scaleMax, mk, label){
  const segs = state.lines.filter(l => (entry.parts[l.id] || 0) > 0)
    .map(l => `<span style="width:${(entry.parts[l.id] / scaleMax * 100).toFixed(2)}%;background:${colorOf(l)}"></span>`).join('');
  return `<div class="xbar" role="img" aria-label="${esc(label)}">${segs}<i class="tick" style="left:${clamp(mk / scaleMax * 100, 0, 100).toFixed(2)}%"></i></div>`;
}
function causeOf(dim, key, w, mk){
  let best = null, bv = 0;
  state.lines.forEach(l => {
    const comp = compOf(l); if (!comp) return;
    const t = comp[dim] || {}, sum = Object.values(t).reduce((a, b) => a + b, 0) || 100;
    const ex = (w[l.id] || 0) * ((t[key] || 0) / sum * 100 - mk);
    if (ex > bv) { bv = ex; best = l; }
  });
  return bv >= 0.8 ? best : null;
}

  const unknown = state.lines.filter(l => !compOf(l) && (w[l.id] || 0) > 0);

  const sRows = SECTORS.slice().sort((a, b) => sb[b.id].total - sb[a.id].total);

  if (topS) {
    const cause = cmpWord(sb[topS.id].total, sm[topS.id]).startsWith('Un peu plus') || cmpWord(sb[topS.id].total, sm[topS.id]).startsWith('Nettement plus') ? causeOf('s', topS.id, w, sm[topS.id]) : null;
    ins.push(`Ton premier secteur : ${topS.name}, ${pct(sb[topS.id].total)} (marché mondial : ${pct(sm[topS.id])}). ${cmpWord(sb[topS.id].total, sm[topS.id])}${cause ? ` C'est surtout ta ligne ${cause.short} qui en ajoute.` : ''}`);
  }

  const sD = SECTORS.filter(s => !topS || s.id !== topS.id).map(s => ({ s, d:sb[s.id].total - sm[s.id] }));

  const maxGap = Math.max(...gaps), us = cb.US.total, tech = sb.tech.total;

  else if (maxGap < 9) verdict = 'Tu n’es pas trop concentré : aucun pays ni secteur ne s’écarte fortement du marché mondial.';
  else verdict = 'Globalement réparti, avec quelques écarts par rapport au marché mondial.';

  const present = state.lines.filter(l => (w[l.id] || 0) > 0.0001 && compOf(l));
  const keys = present.map(l => `<span style="--c:${colorOf(l)}"><i class="k"></i>${esc(l.short)}</span>`).join('') + `<span><i class="kt"></i>Marché mondial</span>`;
  const cScale = Math.max(10, Math.ceil(Math.max(...cRows.map(c => Math.max(cb[c.id].total, cm[c.id])), 1) / 10) * 10);
  const sScale = Math.max(10, Math.ceil(Math.max(...sRows.map(s => Math.max(sb[s.id].total, sm[s.id])), 1) / 10) * 10);
  const rowC = c => `<div class="xrow"><div class="xtop"><span class="xname">${esc(c.name)}</span><span><b>${pctA(cb[c.id].total)}</b><small>marché ${pctA(cm[c.id])}</small></span></div>${stackBar(cb[c.id], cScale, cm[c.id], `${c.name} : ${pct(cb[c.id].total, 1)} chez toi, ${pct(cm[c.id], 1)} pour le marché`)}</div>`;
  const rowS = s => `<div class="xrow"><div class="xtop"><span class="xname">${esc(s.name)}</span><span><b>${pctA(sb[s.id].total)}</b><small>marché ${pctA(sm[s.id])}</small></span></div>${stackBar(sb[s.id], sScale, sm[s.id], `${s.name} : ${pct(sb[s.id].total, 1)} chez toi, ${pct(sm[s.id], 1)} pour le marché`)}<p class="xex">${esc(s.ex)}</p></div>`;

function calEvents(y, m){
  const ev = {};
  const add = (iso, type, text) => { (ev[iso] = ev[iso] || []).push({ type, text }); };
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d = 1; d <= days; d++) {
    const dt = utcDate(y, m, d), wd = dt.getUTCDay();
    const cl = closedLabel(dt);
    if (cl && wd !== 0 && wd !== 6) add(isoOf(dt), 'closed', `Bourse fermée (${cl})`);
    const iso = isoOf(dt);
    if (iso.endsWith('-12-24') || iso.endsWith('-12-31')) if (wd !== 0 && wd !== 6) add(iso, 'closed', 'Bourse fermée à 14h05');
  }
  const ym = ymOf(y, m);
  state.journal.forEach(e => {
    if (!String(e.date || '').startsWith(ym)) return;
    const what = (e.orders || []).map(o => `${o.qty} ${o.label || o.line}`).join(', ');
    add(e.date, e.type === 'sell' || e.type === 'start' ? 'step' : 'done', e.type === 'start' ? 'Point de départ' : e.type === 'sell' ? `Vente : ${what}` : e.type === 'setup' ? `Mise en place : ${what}` : `Investi${what ? ' : ' + what : ''}`);
  });
  if (!monthDone(ym)) {
    const dt = adjustedDate(y, m, state.settings.investDay);
    if (dt >= todayUTC() || ym === parisNow().ym) add(isoOf(dt), 'plan', 'Jour d\u2019investissement prévu');
  }
  if (m === 1) add(isoOf(adjustedDate(y, 1, 15)), 'step', 'Revue annuelle : vérifie tes cibles');
  const open = isoToDate(state.settings.peaOpen);
  if (open && isPEA() && open.getUTCFullYear() + 5 === y && open.getUTCMonth() + 1 === m) add(isoOf(utcDate(y, m, open.getUTCDate())), 'step', 'Ton PEA a 5 ans');
  return ev;
}
function gcalLink(){
  const day = state.settings.investDay;
  const p = parisNow();
  let y = p.y, m = p.m; if (p.d > day) { m += 1; if (m > 12) { m = 1; y += 1; } }
  const ymd = `${y}${String(m).padStart(2, '0')}${String(day).padStart(2, '0')}`;
  const q = new URLSearchParams({ action:'TEMPLATE', text:'Ma stratégie : investir sur mon PEA', dates:`${ymd}T153000/${ymd}T160000`, ctz:'Europe/Paris',
    details:"Ouvre Ma stratégie et passe ton ordre du mois (idéalement entre 15h30 et 17h).", recur:`RRULE:FREQ=MONTHLY;BYMONTHDAY=${day}` });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function viewCalendar(){

    return `<article class="entry"><div class="entry-head"><time datetime="${esc(e.date)}">${esc(isoToFr(e.date))}</time>${mood ? `<span title="${esc(mood.label)}">${mood.emoji}</span>` : ''}</div>
      <h3>${esc(title)}</h3>${items ? `<ul>${items}</ul>` : ''}
      ${e.deposit ? `<p class="small muted">Versement : ${eur(e.deposit)}</p>` : ''}

  }).join('');
  const inv = investedTotal(), total = inv + (+state.cash || 0), dep = +state.totalDeposits || 0, diff = total - dep;

  return `
  <section class="hero" style="padding-bottom:0"><h1>Calendrier</h1></section>
  <section class="panel">
    <div class="cal-head">
      <h2>${esc(cap1(dateFr(utcDate(y, m, 1), { month:'long', year:'numeric' })))}</h2>
      <div class="cal-nav">
        <button class="icon-btn" data-action="cal-prev" aria-label="Mois précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="icon-btn" data-action="cal-next" aria-label="Mois suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>

    ${detail}
    <a class="btn btn-line btn-block" style="margin-top:16px" href="${esc(gcalLink())}" target="_blank" rel="noopener">Ajouter le rappel mensuel à mon agenda</a>

function projectionHTML(){
  const p0 = investedTotal() + (+state.cash || 0), n = projYears;
  const r4 = fv(p0, projMonthly, 0.04, n), r6 = fv(p0, projMonthly, 0.06, n), r10 = fv(p0, projMonthly, 0.10, n);
  const versed = p0 + projMonthly * 12 * n;
  return `<p class="muted small" style="margin-top:6px">En partant de ${eur0(p0)}, tu auras versé ${eur0(versed)}.</p>
    <div class="proj-out"><div><b>${eur0(r4)}</b><span>à 4 %/an</span></div><div class="main"><b>${eur0(r6)}</b><span>à 6 %/an, ta base</span></div><div><b>${eur0(r10)}</b><span>à 10 %/an, le bonus</span></div></div>
    ${chartSVG(p0, projMonthly, n)}`;
}
function chartSVG(p0, monthly, years){
  const W = 320, H = 160, pl = 6, pr = 6, pt = 10, pb = 22;
  const maxV = fv(p0, monthly, 0.10, years) * 1.04 || 1;
  const x = t => pl + (W - pl - pr) * (t / years), y = v => pt + (H - pt - pb) * (1 - v / maxV);
  const pts = f => { const a = []; for (let t = 0; t <= years; t += Math.max(0.25, years / 40)) a.push(`${x(t).toFixed(1)},${y(f(t)).toFixed(1)}`); a.push(`${x(years).toFixed(1)},${y(f(years)).toFixed(1)}`); return a.join(' '); };
  const ser = [[0.10, 'var(--amber)', 2], [0.06, 'var(--good)', 3.2], [0.04, 'var(--ink-3)', 2]];
  const lines = ser.map(([r, c, sw]) => `<polyline fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" points="${pts(t => fv(p0, monthly, r, t))}"/>`).join('');
  const versed = `<polyline fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="4 4" points="${pts(t => p0 + monthly * 12 * t)}"/>`;
  const step = years <= 5 ? 1 : years <= 12 ? 2 : 5, ticks = [];
  for (let t = 0; t <= years; t += step) ticks.push(`<text x="${x(t).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--ink-2)" text-anchor="${t === 0 ? 'start' : 'middle'}">${t === 0 ? 'auj.' : t + ' an' + (t > 1 ? 's' : '')}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution estimée sur ${years} ans à 4, 6 et 10 % par an, et total versé en pointillés"><line x1="${pl}" y1="${H - pb}" x2="${W - pr}" y2="${H - pb}" stroke="var(--line)"/>${versed}${lines}${ticks.join('')}</svg>`;
}

  if (g.cdi && g.safety && g.dip) return { text:`Les 3 feux sont verts : passe à 15 % de ton salaire, soit environ ${eur0(fifteen)} par mois.`, amount:fifteen };
  if (g.cdi) return { text:`Revenus stables : passe à 10 % de ton salaire, soit environ ${eur0(ten)} par mois.`, amount:ten };
  return { text:`Garde ${eur0(state.settings.monthly)} par mois pour l'instant. Avec des revenus stables, tu pourras passer à environ ${eur0(ten)}.`, amount:null };

function applyTemplate(id){
  const tpl = TEMPLATES.find(t => t.id === id); if (!tpl) return;

  tpl.lines.forEach(([ticker, target, max]) => {
    const cat = CATALOG.find(c => c.ticker === ticker); if (!cat) return;

    if (!l) { l = newLineFrom(Object.assign({}, cat, { status:'buy', ci:TPL_COLORS[ticker] != null && !state.lines.some(x => x.ci === TPL_COLORS[ticker]) ? TPL_COLORS[ticker] : nextColor() })); state.lines.push(l); }

  state.lines.forEach(l => { if (!used.has(l.id) && l.status === 'buy') { l.status = 'pause'; l.target = 0; l.max = null; } });

function applyBuy(l, qty, price){

function saveConfirm(){
  const orders = [];
  for (const l of buyLines()) {
    const q = parseNum($('c-q-' + l.id).value), pr = parseNum($('c-p-' + l.id).value);
    if (!isFinite(q) || q < 0) return errBox(`Nombre de parts invalide pour ${l.short}.`);
    if (q > 0 && (!isFinite(pr) || pr <= 0)) return errBox(`Indique le prix payé pour ${l.short}.`);
    if (q > 0) orders.push({ line:l.id, label:l.short, qty:q, price:round2(pr) });
  }
  const dv = parseNum($('c-deposit').value), dep = isFinite(dv) && dv > 0 ? round2(dv) : 0;
  if (!orders.length && !dep) return errBox('Indique au moins un achat ou un versement.');
  const spent = orders.reduce((a, o) => a + o.qty * o.price, 0);
  if (spent > (+state.cash || 0) + dep + 1) return errBox(`Tes achats (${eur(spent)}) dépassent l'argent disponible (${eur((+state.cash || 0) + dep)}).`);
  const moodEl = document.querySelector('#dlg-body input[name="mood"]:checked');
  const p = parisNow();
  const before = { cash:state.cash, deposits:state.totalDeposits, lines:snapshotLines(orders.map(o => o.line)) };
  orders.forEach(o => applyBuy(lineById(o.line), o.qty, o.price));
  state.cash = round2(Math.max(0, (+state.cash || 0) + dep - spent));
  state.totalDeposits = round2((+state.totalDeposits || 0) + dep);
  if (orders.length) state.pricesUpdatedAt = p.iso;
  state.journal.push({ id:uid('e'), ts:Date.now(), type:'buy', date:p.iso, month:p.ym, deposit:dep, orders, mood:moodEl ? moodEl.value : null, note:'', before });
  amountTouched = false; amountEditing = false; amountThisMonth = state.settings.monthly;
  closeDlg(); commit();
  if (moodEl && moodEl.value === 'panic') toast('C’est noté. Relis « Ça baisse, je fais quoi ? » avant de vendre quoi que ce soit.'); else celebrate();
}
function undoEntry(id){
  const i = state.journal.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = state.journal[i];
  if (e.locked || !e.before) return;
  const bl = e.before.lines || {};
  Object.keys(bl).forEach(k => {
    let l = lineById(k);
    if (!l && e.removed && e.removed[k]) { l = Object.assign({}, e.removed[k]); state.lines.push(l); }
    if (l) Object.assign(l, bl[k]);
  });
  (e.added || []).forEach(id2 => { state.lines = state.lines.filter(l => l.id !== id2); });
  state.cash = e.before.cash; state.totalDeposits = e.before.deposits;
  state.journal.splice(i, 1);
  commit(); toast('Saisie annulée.');
}

function savePrices(){

function saveTargets(){
  const vals = [];
  for (const l of buyLines()) {
    const t = parseNum($('t-' + l.id).value), xs = $('x-' + l.id).value.trim(), x = xs === '' ? null : parseNum(xs);

    vals.push([l, t, x]);

  const sum = vals.reduce((a, v) => a + v[1], 0);

const TESS = {

  langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/fra@1.0.0/4.0.0_best_int'

let tessP = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tessP) return tessP;
  tessP = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = TESS.script; sc.async = true;
    sc.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error('load'));
    sc.onerror = () => { tessP = null; rej(new Error('load')); };
    document.head.appendChild(sc);

async function prepImage(file){

    if (typeof createImageBitmap !== 'function') return file;
    const bmp = await createImageBitmap(file);
    const scale = bmp.width < 900 ? 2 : (bmp.width > 1600 ? 1600 / bmp.width : 1);
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d', { willReadFrequently:true });
    cx.drawImage(bmp, 0, 0, w, h);
    const im = cx.getImageData(0, 0, w, h), d = im.data;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 64) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
    const dark = sum / n < 110;
    for (let i = 0; i < d.length; i += 4) { let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; if (dark) g = 255 - g; d[i] = d[i + 1] = d[i + 2] = g; }
    cx.putImageData(im, 0, 0);
    return await new Promise(res => cv.toBlob(b => res(b || file), 'image/png'));
  } catch (e) { return file; }
}

    logger:m => { if (onProgress && m && typeof m.progress === 'number') onProgress(m.status || '', m.progress); } });
  try { const { data } = await worker.recognize(file); return (data && data.text) || ''; }
  finally { try { await worker.terminate(); } catch (e) { /* rien */ } }
}

  const cashLine = raw.match(new RegExp('Solde\\s+Esp[eèé]ces[^\\n]*?(?:\\d{2}/\\d{2}/\\d{4})?[^\\d\\n]*' + AMT));
  if (cashLine) out.cash = amt(cashLine[1]);
  const pruRe = new RegExp('^' + AMT + '\\s*(?:€|E|e|C)?\\s*[/|]\\s*(\\d+(?:[.,]\\d+)?)\\s*$');
  const coursRe = new RegExp(AMT + '\\s*(?:€|E|e|C)?\\s*[+\\-–]\\s*\\d');
  const headerRe = /^(valeur|cours|px\.?|trier|montant|comptes|ordres|listes|march|menu|plan d|épargner|dès|risque|vue instantan|total|évaluation|solde)/i;
  let block = [];
  lines.forEach(line => {
    const m = line.match(pruRe);
    if (!m) { block.push(line); return; }
    const pru = amt(m[1]), parts = parseNum(m[2]);
    let price = NaN, nameParts = [], value = NaN;
    block.forEach(b => {
      const c = b.match(coursRe);
      if (c && !isFinite(price)) { price = amt(c[1]); return; }
      if (headerRe.test(b)) { nameParts = []; return; }
      const letters = (b.match(/[A-Za-zÀ-ÿ]/g) || []).length, upp = (b.match(/[A-ZÀ-Þ]/g) || []).length;

    else if (dq < 0) { sold.push({ line:l.id, label:l.short, qty:-dq, price:it.price }); l.parts = it.parts; }
    l.price = round2(it.price);
    if (it.pru) l.pru = it.pru;
  });
  d.items.forEach(it => {
    if (it.type === 'new' && it.add) {
      const kind = guessKind(it.name + ' ' + it.isin);
      const cat = CATALOG.find(c => c.isin === it.isin) || catalogByName(it.name);
      const nl = newLineFrom({ name:cat ? cat.name : it.name, short:cat ? cat.short : it.name.split(' ').slice(0, 3).join(' ').slice(0, 20), ticker:cat ? cat.ticker : '', isin:it.isin || (cat ? cat.isin : ''), ter:cat ? cat.ter : 0, kind, status:'buy', target:0, parts:it.parts, price:round2(it.price), pru:it.pru });
      state.lines.push(nl); added.push(nl.id);
      orders.push({ line:nl.id, label:nl.short, qty:it.parts, price:round2(it.pru || it.price) });
    }
    if (it.type === 'missing' && it.sold) {
      const l = lineById(it.id); if (!l) return;
      removed[l.id] = clone(l);
      sold.push({ line:l.id, label:l.short, qty:l.parts, price:l.price });
      state.lines = state.lines.filter(x => x.id !== l.id);
      state.lines.forEach(x => { if (x.countsIn === l.id) x.countsIn = null; });
    }
  });
  state.cash = nb.newCash;
  if (depEl) state.cash = round2(Math.max(0, (d.cash != null ? d.cash : (+before.cash || 0) + dep + nb.sells - nb.buys)));
  state.totalDeposits = round2((+state.totalDeposits || 0) + dep);
  state.pricesUpdatedAt = p.iso;
  const moodEl = document.querySelector('#dlg-body input[name="mood"]:checked');
  if (d.start) {
    state.journal.push({ id:uid('p'), ts:Date.now(), type:'start', date:p.iso, month:p.ym, deposit:dep, orders, mood:null, note:'Portefeuille de départ, lu sur une capture.', before, added, removed });
    importDraft = null; amountTouched = false; amountEditing = false; amountThisMonth = state.settings.monthly;
    closeDlg(); commit();
    toast(added.length ? 'C\u2019est noté. Donne une cible à tes nouvelles lignes.' : 'C\u2019est noté : ton portefeuille est à jour.');
    return;
  }
  if (orders.length) state.journal.push({ id:uid('i'), ts:Date.now(), type:'buy', date:p.iso, month:p.ym, deposit:dep, orders, mood:moodEl ? moodEl.value : null, note:'Mis à jour avec une capture.', before, added, removed });
  else if (sold.length) state.journal.push({ id:uid('s'), ts:Date.now(), type:'sell', date:p.iso, month:p.ym, deposit:0, orders:sold, note:'Depuis une capture.', before, added, removed });
  importDraft = null;
  amountTouched = false; amountEditing = false; amountThisMonth = state.settings.monthly;
  closeDlg(); commit();
  const nNew = added.length;
  if (orders.length && !(moodEl && moodEl.value === 'panic')) { celebrate(); if (nNew) setTimeout(() => toast('Pense à donner une cible à ta nouvelle ligne.'), 600); }
  else toast(orders.length ? 'C’est noté.' : 'Portefeuille mis à jour.');
}

/* --- Sauvegarde --- */
async function exportBackup(){
  state.lastBackup = Date.now(); saveLocal();
  const name = 'ma-strategie-sauvegarde-' + parisNow().iso + '.json';
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:'Sauvegarde Ma stratégie' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Sauvegarde enregistrée dans tes téléchargements.');
  } catch (e) {
    const ok = await copyText(JSON.stringify(state));
    toast(ok ? 'Sauvegarde copiée : colle-la dans une note.' : 'Sauvegarde impossible ici.');
  }
}
function restoreFromText(txt){
  const obj = JSON.parse(txt);
  if (!obj || (!obj.lines && !obj.holdings)) throw new Error('format');
  state = migrate(obj); amountThisMonth = state.settings.monthly; amountTouched = false;
  closeDlg(); commit(); toast('Sauvegarde restaurée.');
}

function saveSettings(){
  const day = Math.round(parseNum($('set-day').value)), monthly = parseNum($('set-monthly').value), minv = parseNum($('set-min').value), open = $('set-open').value;
  if (!isFinite(day) || day < 1 || day > 28) return errBox('Le jour doit être entre 1 et 28.');
  if (!isFinite(monthly) || monthly < 0) return errBox('Montant mensuel invalide.');
  if (!isFinite(minv) || minv < 0) return errBox('Ordre minimum invalide.');
  const account = ['pea', 'jeune', 'cto'].includes($('set-account').value) ? $('set-account').value : state.settings.account;
  const broker = ['bourso', 'other'].includes($('set-broker').value) ? $('set-broker').value : state.settings.broker;
  state.settings = Object.assign({}, state.settings, { investDay:day, monthly:round2(monthly), minOrder:minv, account, broker, peaOpen:/^\d{4}-\d{2}-\d{2}$/.test(open) ? open : (open === '' ? null : state.settings.peaOpen) });
  if (!amountTouched) amountThisMonth = state.settings.monthly;
  projMonthly = clamp(Math.round(state.settings.monthly / 10) * 10, 50, 1000);
  closeDlg(); commit(); toast('Réglages enregistrés.');
}

let toastTimer = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000); }
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; }
    catch (e2) { return false; }
  }
}

document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case 'open-settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'open-panic': openDlg(panicHTML()); break;
    case 'close-dlg': closeDlg(); break;
    case 'open-confirm': openConfirm(); break;
    case 'save-confirm': saveConfirm(); break;
    case 'open-prices': openPrices(); break;
    case 'save-prices': savePrices(); break;
    case 'open-targets': openTargets(); break;
    case 'save-targets': saveTargets(); break;
    case 'add-line': openAddLine(); break;
    case 'add-cat': { const c = CATALOG[+el.dataset.i]; if (c) openEditLine(newLineFrom(Object.assign({}, c, { status:'buy' })), true); break; }
    case 'add-manual': {
      const q = (($('q-line') || {}).value || '').trim(), Q = q.toUpperCase();
      const cat = q && CATALOG.find(c => c.isin === Q || c.ticker === Q || c.name.toUpperCase().includes(Q));
      if (cat) { openEditLine(newLineFrom(Object.assign({}, cat, { status:'buy' })), true); break; }
      const g = guessKind(q);
      const isIsin = /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(Q);
      openEditLine(newLineFrom({ name:q || 'Nouvelle ligne', short:(isIsin ? 'Nouvelle ligne' : (q || 'Nouvelle ligne')).slice(0, 20), isin:isIsin ? Q : '', kind:g === 'custom' ? 'stock' : g, status:'buy' }), true);
      break;
    }
    case 'edit-line': { const l = lineById(el.dataset.id); if (l) openEditLine(l, false); break; }
    case 'save-line': saveLine(el.dataset.id, el.dataset.new); break;
    case 'delete-line': askDelete(el.dataset.id); break;
    case 'delete-confirm': deleteLine(el.dataset.id, el.dataset.sold === '1'); break;
    case 'e-status': {
      const v = el.dataset.v; $('e-status').value = v;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
      $('e-buy').hidden = v !== 'buy'; $('e-pause').hidden = v !== 'pause';
      break;
    }
    case 'import': startImport(); break;
    case 'import-apply': applyImport(); break;
    case 'undo': undoEntry(el.dataset.id); break;
    case 'intro-ok': state.introSeen = true; commit(); break;
    case 'edit-amount': amountEditing = true; render(); setTimeout(() => { const i = $('amt'); if (i) i.focus(); }, 30); break;
    case 'set-amount': amountThisMonth = +el.dataset.v; amountTouched = true; amountEditing = false; render(); break;
    case 'use-amount': { const v = +el.dataset.v; state.settings.monthly = v; amountThisMonth = v; projMonthly = clamp(v, 50, 1000); commit(); toast(`Nouveau versement : ${eur0(v)} par mois.`); break; }
    case 'pf-view': pfView = el.dataset.v === 'analyse' ? 'analyse' : 'lines'; render(); break;
    case 'ana-view': anaView = el.dataset.v === 'secteurs' ? 'secteurs' : 'pays'; render(); break;
    case 'amode': analysisMode = el.dataset.v === 'after' ? 'after' : 'now'; render(); break;
    case 'cal-prev': { let { y, m } = calMonth; m -= 1; if (m < 1) { m = 12; y -= 1; } calMonth = { y, m }; calSel = null; render(); break; }
    case 'cal-next': { let { y, m } = calMonth; m += 1; if (m > 12) { m = 1; y += 1; } calMonth = { y, m }; calSel = null; render(); break; }
    case 'cal-day': calSel = calSel === el.dataset.iso ? null : el.dataset.iso; render(); break;
    case 'copy': { const ok = await copyText(el.dataset.copy); toast(ok ? `ISIN ${el.dataset.copy} copié.` : `ISIN : ${el.dataset.copy}`); break; }
    case 'theme': { const v = el.dataset.v; try { localStorage.setItem(LS_THEME, v); } catch (e) { /* rien */ } applyTheme(v); el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); break; }
    case 'copy-backup': { const ok = await copyText(JSON.stringify(state)); toast(ok ? 'Sauvegarde copiée. Colle-la dans une note.' : 'Copie impossible sur cet appareil.'); break; }
    case 'export-backup': exportBackup(); break;
    case 'import-backup-file': { const f = $('backup-file'); f.value = ''; f.click(); break; }
    case 'install': installApp(); break;
    case 'open-price-source': openPriceSource(); break;
    case 'ps-save': savePriceSource(); break;
    case 'ps-remove': state.settings.priceUrl = null; closeDlg(); commit(); toast('Cours automatiques arrêtés.'); break;
    case 'copy-block': { const ok = await copyText(sheetBlock()); toast(ok ? 'Bloc copié. Colle-le dans la case A1.' : 'Copie impossible ici.'); break; }
    case 'refresh-prices': refreshPrices(true); break;
    case 'ob-next': {
      if (!ob) obInit();
      if (ob.step === 2 && !obReadStep2()) break;
      ob.step = Math.min(3, ob.step + 1); render(); window.scrollTo(0, 0); break;
    }
    case 'ob-back': if (ob) { if (ob.step === 2) { const m = $('ob-monthly'), d = $('ob-day'), o = $('ob-open'); if (m) ob.monthly = m.value; if (d) ob.day = d.value; if (o) ob.open = o.value; } ob.step = Math.max(0, ob.step - 1); render(); window.scrollTo(0, 0); } break;
    case 'ob-tpl': ob.tpl = el.dataset.v; document.querySelectorAll('[data-action="ob-tpl"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); break;
    case 'ob-set': {
      const m = $('ob-monthly'), d = $('ob-day'), o = $('ob-open');
      if (m) ob.monthly = m.value; if (d) ob.day = d.value; if (o) ob.open = o.value;
      ob[el.dataset.group] = el.dataset.v; render(); break;
    }
    case 'ob-finish': obFinish(el.dataset.v); break;
    case 'open-templates': openTemplates(); break;
    case 'tpl-apply': {
      const t = TEMPLATES.find(x => x.id === el.dataset.v);
      applyTemplate(el.dataset.v); closeDlg(); commit(); toast(`Modèle « ${t ? t.name : ''} » appliqué.`); break;
    }
    case 'set-chip': {
      const g = el.dataset.group; const h = $('set-' + g); if (h) h.value = el.dataset.v;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); break;
    }
    case 'share-app': shareApp(); break;
    case 'open-goal': openGoal(); break;
    case 'goal-save': saveGoal(); break;
    case 'goal-remove': state.goal = null; closeDlg(); commit(); toast('Objectif supprimé.'); break;
    case 'toggle-reminder': toggleReminder(); break;
    case 'restore': {
      try { restoreFromText($('restore-text').value); }
      catch (e) { errBox("Cette sauvegarde n'est pas lisible. Copie-la en entier."); }
      break;
    }
    case 'reset': {
      if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Toucher encore pour confirmer'; break; }
      state = clone(DEFAULT_STATE); obInit(); amountThisMonth = state.settings.monthly; amountTouched = false;
      closeDlg(); commit(); window.scrollTo(0, 0); break;
    }
    default: break;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'cap-file') { runImport(el.files); return; }
  if (el.id === 'backup-file') {
    const f = el.files && el.files[0]; if (!f) return;
    const read = f.text ? f.text() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(f); });
    read.then(t => restoreFromText(t)).catch(() => toast("Ce fichier n'est pas une sauvegarde lisible."));
    return;
  }
  if (el.dataset && el.dataset.actionChange === 'kind') { $('e-stock').hidden = el.value !== 'stock'; $('e-custom').hidden = el.value !== 'custom'; return; }
  if (el.dataset && el.dataset.actionChange === 'imp-add') { importDraft.items[+el.dataset.i].add = el.checked; showImportReview(); return; }
  if (el.dataset && el.dataset.actionChange === 'imp-sold') { importDraft.items[+el.dataset.i].sold = el.checked; showImportReview(); return; }
  const b = el.dataset && el.dataset.bind; if (!b) return;
  const v = parseNum(el.value);
  if (b === 'amount') { if (isFinite(v) && v >= 0) { amountThisMonth = round2(v); amountTouched = true; } amountEditing = false; render(); return; }
  if (b === 'green') { state.greens[el.dataset.key] = el.checked; commit(); return; }
  if (b === 'salary') { state.salary = isFinite(v) && v > 0 ? round2(v) : null; commit(); return; }
});
document.addEventListener('input', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind;
  if (b === 'proj-monthly') { projMonthly = +el.value; $('r-monthly-v').textContent = eur0(projMonthly); $('proj').innerHTML = projectionHTML(); }
  if (b === 'proj-years') { projYears = +el.value; $('r-years-v').textContent = projYears + ' an' + (projYears > 1 ? 's' : ''); $('proj').innerHTML = projectionHTML(); }
  if (el.dataset && el.dataset.actionInput === 'tsum') {
    const sum = buyLines().reduce((a, l) => { const x = parseNum(($('t-' + l.id) || {}).value); return a + (isFinite(x) ? x : 0); }, 0);
    const t = $('tsum'); if (t) { t.textContent = pct(sum, sum % 1 ? 1 : 0); t.className = Math.abs(sum - 100) < 0.01 ? 'ok' : 'neg'; }
  }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (ev.key === 'Enter' && el.tagName === 'INPUT' && el.dataset && el.dataset.bind && el.type !== 'checkbox') el.blur();
});
$('dlg').addEventListener('click', ev => { if (ev.target === $('dlg')) closeDlg(); });
$('dlg').addEventListener('close', () => { importRun++; });

render();
setInterval(renderMarket, 60000);
initPWA();
window.MaStrategie = { parseBourso, matchLineByName };
})();
